<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Más Ejercicios</title>

    <link
        rel="stylesheet"
        href="Untitled-1.css"

        href="imagenes/biceps/curl_concentrado.webp"
    >

</head>


<body>


    <section class="exercise-library">


        <!-- =========================
             TITULO
        ========================= -->

        <div class="section-title">

            <span>
                EJERCICIOS
            </span>

            <h2 id="tituloMusculo">
                Pecho
            </h2>

            <p id="descripcionMusculo">
                Ejercicios recomendados para
                este grupo muscular.
            </p>

        </div>



        <!-- =========================
             SELECTOR DE MUSCULO
        ========================= -->

        <div class="selector-musculo">

            <label for="selectorMusculo">
                Selecciona un grupo muscular:
            </label>

            <select id="selectorMusculo">

                <option value="pecho">
                    Pecho
                </option>

                <option value="espalda">
                    Espalda
                </option>

                <option value="hombros">
                    Hombros
                </option>

                <option value="biceps">
                    Bíceps
                </option>

                <option value="triceps">
                    Tríceps
                </option>

                <option value="abdomen">
                    Abdomen
                </option>

                <option value="cuadriceps">
                    Piernas
                </option>

                <option value="gluteos">
                    Glúteos
                </option>

                <option value="gemelos">
                    Gemelos
                </option>

            </select>

        </div>



        <!-- =========================
             LISTA DE EJERCICIOS
        ========================= -->

        <div
            id="listaEjercicios"
            class="exercise-library-grid"
        >

        </div>



        <!-- =========================
             VOLVER
        ========================= -->

        <div class="back-home">

            <a
                href="index.html"
                class="btn-secondary"
            >
                ← Volver
            </a>

        </div>


    </section>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="ejercicios.js"></script>

</body>

</html>
